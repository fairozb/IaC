[defaults]
inventory = inventory.ini
retry_files_enabled = False
host_key_checking = True
stdout_callback = yaml
deprecation_warnings = False
# Root tasks expand this to /root/.ansible/tmp.
# Tasks that become the monitoring user override it with
# /var/lib/monitoring/.ansible/tmp so scratch files never land in
# /opt/monitoring_application.
remote_tmp = ~/.ansible/tmp

[privilege_escalation]
become = False
become_method = sudo
become_ask_pass = False
